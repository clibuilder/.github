name: verify-and-release
on:
  push:
    branches:
      - $default-branch
  pull_request:
    types: [opened, synchronize]

jobs:
  code:
    uses: clibuilder/.github/.github/workflows/pnpm-verify.yml@main
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Secretless: GITHUB_TOKEN for the version PR, npm trusted publishing (OIDC) to
  # publish. Register a trusted publisher at npmjs.com/package/<name>/access naming
  # this repo and this file, or the publish step has no credentials.
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: clibuilder/.github/.github/workflows/pnpm-release-changeset.yml@main
    needs: code
    permissions:
      id-token: write
      contents: write
      pull-requests: write
