name: pnpm-verify
on:
  workflow_call:
    inputs:
      os:
        type: string
        required: false
        default: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      node-version:
        type: string
        required: false
        # Aliases, not pinned majors, so the matrix follows the Node release train
        # instead of drifting: `lts/*` is the current LTS and `lts/-1` the one before
        # it. A package that claims support for something older than `lts/-1` needs
        # to pass that major in explicitly.
        default: '["lts/-1", "lts/*"]'
      codecov-node-version:
        type: string
        required: false
        # Must name an entry of `node-version`, or coverage is never uploaded.
        default: 'lts/*'
      codecov-flags:
        type: string
        required: false
    secrets:
      CODECOV_TOKEN:
        required: false
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ${{ fromJson(inputs.os) }}
        node-version: ${{ fromJson(inputs.node-version) }}
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from `packageManager` in package.json. Pinning it here
      # instead would silently disagree with the lockfile the repo resolves against.
      - uses: pnpm/action-setup@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install

      - name: Verify (Linux)
        run: xvfb-run -a pnpm verify
        if: ${{ matrix.os == 'ubuntu-latest' }}
      - name: Verify (Windows/Mac)
        run: pnpm verify
        if: ${{ matrix.os != 'ubuntu-latest' }}

      - name: codecov
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == inputs.codecov-node-version
        uses: codecov/codecov-action@v7
        with:
          flags: ${{ inputs.codecov-flags }}
          token: ${{ secrets.CODECOV_TOKEN }}

  # A single, stable check for branch protection to require. The matrix contexts carry
  # the OS and node alias in their names, so pinning those would mean editing protection
  # every time the matrix moves — which is exactly what tracking `lts/*` makes routine.
  all-checks:
    needs: [verify]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: All checks passed
        run: |
          if [[ "${{ needs.verify.result }}" != "success" ]]; then
            exit 1
          fi
