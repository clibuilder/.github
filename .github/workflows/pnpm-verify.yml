name: pnpm-verify
on:
  workflow_call:
    inputs:
      os:
        type: string
        required: false
        default: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      node-version:
        type: string
        required: false
        # Oldest entry tracks the lowest `engines.node` of the packages being
        # verified, newest tracks current. Node 16 was dropped: long EOL, and no
        # package here claims to support it.
        default: '[18, 22, 24]'
      codecov-node-version:
        type: number
        required: false
        # Must name an entry of `node-version`, or coverage is never uploaded.
        default: 24
      codecov-flags:
        type: string
        required: false
    secrets:
      CODECOV_TOKEN:
        required: false
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ${{ fromJson(inputs.os) }}
        node-version: ${{ fromJson(inputs.node-version) }}
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from `packageManager` in package.json. Pinning it here
      # instead would silently disagree with the lockfile the repo resolves against.
      - uses: pnpm/action-setup@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install

      - name: Verify (Linux)
        run: xvfb-run -a pnpm verify
        if: ${{ matrix.os == 'ubuntu-latest' }}
      - name: Verify (Windows/Mac)
        run: pnpm verify
        if: ${{ matrix.os != 'ubuntu-latest' }}

      - name: codecov
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == inputs.codecov-node-version
        uses: codecov/codecov-action@v7
        with:
          flags: ${{ inputs.codecov-flags }}
          token: ${{ secrets.CODECOV_TOKEN }}
