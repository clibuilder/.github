name: pnpm-release-changeset
# Secretless: no CI_GITHUB_TOKEN, no NPM_TOKEN, no GitHub App key, so nothing to rotate.
#
#   - Checkout and changesets/action both use the built-in GITHUB_TOKEN with the
#     caller's grant, so github-actions[bot] opens and pushes the "version packages"
#     PR. GitHub creates that PR's `on: pull_request` runs (CI, CodeQL) but parks them
#     as `action_required` until someone approves them, and a ruleset that requires
#     their checks leaves the PR blocked. So after changesets/action opens or updates
#     the PR, this job finds the parked runs on the branch head, waiting up to about
#     60s for GitHub to create them, and approves each one
#     (`POST /repos/{owner}/{repo}/actions/runs/{run_id}/approve`). The runs then
#     execute against the PR, so every required check reports. This replaces the
#     repobuddy GitHub App token the workflow used to mint for the same purpose.
#   - npm trusted publishing (OIDC) replaces NPM_TOKEN, and adds provenance
#     attestations. npm validates the *caller* workflow, so each package needs a
#     trusted publisher registered at npmjs.com/package/<name>/access naming the
#     calling repo and the caller workflow's filename — not this file.
#
# The caller must grant `id-token: write`, `contents: write` and `pull-requests: write`
# to the job that calls this workflow, plus `actions: write` for the approval. This
# workflow declares no `permissions:` of its own, so the caller's grant passes through
# unchanged. A block here would cap the token: every scope it did not list, `actions`
# included, would drop to `none`, and the approval would fail with 403 even when the
# caller grants `actions: write`. Without `actions: write` the release still succeeds,
# but with a warning and a PR whose runs stay pending.
#
# Modeled on cyberuni/.github's pnpm-release-changeset-oidc.yml.
on:
  workflow_call:
    inputs:
      node-version:
        type: string
        required: false
        # Pinned rather than an `lts/*` alias: alias resolution fetches the
        # Node versions manifest, which has intermittently returned a
        # non-array and failed the job with "manifest.filter is not a function".
        default: '24'
    # Deprecated and ignored. Still declared so a caller that passes them keeps
    # validating while it migrates; a called workflow rejects undeclared secrets.
    # Remove once no caller passes them.
    secrets:
      RELEASE_APP_ID:
        required: false
      RELEASE_APP_PRIVATE_KEY:
        required: false
    outputs:
      published:
        description: 'Whether the release was published'
        value: ${{ jobs.release.outputs.published }}

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published || steps.changesets-v3.outputs.published }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      # No `registry-url:` on purpose. It only exists to write an auth stanza —
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` in a temp .npmrc — which
      # this secretless workflow can never fill in, so every npm and pnpm invocation
      # warns "Failed to replace env in config". The registry itself is not at stake:
      # npmjs.org is npm's default, and repos that care say so in their own .npmrc.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm

      # Trusted publishing requires npm 11.5.1+, so Node LTS's bundled npm may be too old.
      #
      # Pinned to 11 rather than latest: npm 12 changed `npm info --json` to wrap its
      # output in an array (changesets/changesets#2164). @changesets/cli 2.x reads
      # `.versions` straight off the parsed value, sees undefined, concludes every
      # version is unpublished and republishes into E403. cli 3.x fixed that for its npm
      # code path but NOT its pnpm one, and `pnpm info` just delegates to whichever npm
      # is on PATH — so on a pnpm workspace npm 12 turns the E403 into a TypeError in
      # getUnpublishedPackages instead. Pinning npm keeps both majors of changesets
      # working; revisit once the pnpm parser upstream unwraps the array too.
      # Same pin as cyberuni/.github's pnpm-release-changeset-oidc.yml.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@11
          npm --version

      - name: Install Dependencies
        run: pnpm install

      - run: pnpm build

      # changesets/action@v2 only runs against Changesets CLI v3 (it refuses v2), and
      # @v1 reads the v2 CLI's stdout. Pick by the caller's CLI major, so each repo
      # moves to v3 on its own; drop the @v1 step once every caller has. Anything but
      # an exact '3' (including a failed read) keeps the original @v1 path.
      - name: Detect Changesets CLI major
        id: cli
        # Read by path: v3's `exports` map does not expose package.json.
        run: echo "major=$(node -p "require('./node_modules/@changesets/cli/package.json').version.split('.')[0]" || true)" >> "$GITHUB_OUTPUT"

      - name: Create Release Pull Request or Publish to npm
        if: steps.cli.outputs.major != '3'
        id: changesets
        uses: changesets/action@v1
        with:
          commit: 'chore: version packages'
          version: pnpm run version
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # v2 takes the token as the `github-token` input (default: github.token), not
      # the GITHUB_TOKEN env var. Published packages are read from the
      # CHANGESETS_OUTPUT file, which `pnpm run release` inherits.
      - name: Create Release Pull Request or Publish to npm
        if: steps.cli.outputs.major == '3'
        id: changesets-v3
        uses: changesets/action@v2
        with:
          commit-message: 'chore: version packages'
          version-script: pnpm run version
          publish-script: pnpm run release

      # github-actions[bot] opens and pushes the version PR, so GitHub parks the PR's
      # pull_request runs (CI, CodeQL) as action_required until someone approves them.
      # Approve them so they run against the PR; see the header. A failed approval warns
      # rather than failing an otherwise good release. @v1 names its output
      # pullRequestNumber, @v2 pr-number.
      - name: Approve the version packages PR's pending runs
        if: >-
          (steps.changesets.outputs.pullRequestNumber != '' && steps.changesets.outputs.published != 'true') ||
          (steps.changesets-v3.outputs.pr-number != '' && steps.changesets-v3.outputs.published != 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_BRANCH: changeset-release/${{ github.ref_name }}
        run: |
          grant="Grant 'actions: write' in the caller's 'permissions:' for the job that calls this workflow."
          if ! sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$VERSION_BRANCH" --jq .object.sha 2>&1); then
            echo "$sha"
            echo "::warning::Could not read the head of $VERSION_BRANCH, so the version packages PR's runs stay pending approval and its required checks never report."
            exit 0
          fi
          list() {
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=$VERSION_BRANCH&head_sha=$sha&per_page=100" \
              --jq '.workflow_runs[] | select(.conclusion == "action_required" or .status == "action_required" or .status == "waiting") | .id'
          }
          # GitHub creates the PR's runs a few seconds after the push. Poll for up to
          # about 60s, then list once more to catch workflows created a beat later.
          ids=""
          for _ in $(seq 1 12); do
            if ! ids=$(list 2>&1); then
              echo "$ids"
              echo "::warning::Could not list the runs on $VERSION_BRANCH, so the version packages PR's runs stay pending approval and its required checks never report. $grant"
              exit 0
            fi
            [ -n "$ids" ] && break
            sleep 5
          done
          sleep 5
          if more=$(list 2>/dev/null); then ids=$more; fi
          if [ -z "$ids" ]; then
            echo "::warning::No runs on $VERSION_BRANCH at $sha were waiting for approval after 60s. If the version packages PR is still blocked, approve its runs from the Actions tab."
            exit 0
          fi
          for id in $ids; do
            if out=$(gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve" 2>&1); then
              echo "Approved run $id"
            elif grep -qiE '403|Resource not accessible' <<<"$out"; then
              echo "$out"
              echo "::warning::GITHUB_TOKEN may not approve run $id, so it stays pending and the version packages PR stays blocked. $grant"
            else
              echo "$out"
              echo "::warning::Could not approve run $id on $VERSION_BRANCH, so it stays pending and the version packages PR stays blocked. Check that the caller grants 'actions: write'."
            fi
          done
