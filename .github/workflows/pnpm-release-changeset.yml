name: pnpm-release-changeset
# Secretless: no CI_GITHUB_TOKEN, no NPM_TOKEN, so nothing to rotate.
#
#   - The "version packages" PR is opened with a repobuddy GitHub App token when the
#     caller passes RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY. A PR opened with
#     GITHUB_TOKEN does not trigger `on: pull_request` workflows, so its required
#     checks never report and it can only be merged by an admin; the app token does
#     trigger them. An app key does not expire, so there is still nothing to rotate.
#     Without those secrets the job falls back to the built-in GITHUB_TOKEN, and the
#     org must have "Allow GitHub Actions to create and approve pull requests" enabled.
#   - npm trusted publishing (OIDC) replaces NPM_TOKEN, and adds provenance
#     attestations. npm validates the *caller* workflow, so each package needs a
#     trusted publisher registered at npmjs.com/package/<name>/access naming the
#     calling repo and the caller workflow's filename — not this file — and the caller
#     must grant `id-token: write` as well.
on:
  workflow_call:
    inputs:
      node-version:
        type: string
        required: false
        # Pinned rather than an `lts/*` alias: alias resolution fetches the
        # Node versions manifest, which has intermittently returned a
        # non-array and failed the job with "manifest.filter is not a function".
        default: '24'
    secrets:
      RELEASE_APP_ID:
        required: false
      RELEASE_APP_PRIVATE_KEY:
        required: false
    outputs:
      published:
        description: 'Whether the release was published'
        value: ${{ jobs.release.outputs.published }}

permissions:
  # Mints the OIDC token npm exchanges for short-lived publish credentials.
  id-token: write
  # Lets changesets/action push the version branch and tags.
  contents: write
  # Lets changesets/action open the "version packages" PR.
  pull-requests: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published || steps.changesets-v3.outputs.published }}
    env:
      HAS_RELEASE_APP: ${{ secrets.RELEASE_APP_ID != '' && secrets.RELEASE_APP_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/create-github-app-token@v3
        if: env.HAS_RELEASE_APP == 'true'
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # The version branch is pushed with the checkout's credentials, so the app token
      # goes here too; otherwise the push would not re-trigger the PR's checks.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      # Version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      # No `registry-url:` on purpose. It only exists to write an auth stanza —
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` in a temp .npmrc — which
      # this secretless workflow can never fill in, so every npm and pnpm invocation
      # warns "Failed to replace env in config". The registry itself is not at stake:
      # npmjs.org is npm's default, and repos that care say so in their own .npmrc.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm

      # Trusted publishing requires npm 11.5.1+. Node LTS may ship an older npm.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install Dependencies
        run: pnpm install

      - run: pnpm build

      # changesets/action@v2 only runs against Changesets CLI v3 (it refuses v2), and
      # @v1 reads the v2 CLI's stdout. Pick by the caller's CLI major, so each repo
      # moves to v3 on its own; drop the @v1 step once every caller has.
      - name: Detect Changesets CLI major
        id: cli
        # Read by path: v3's `exports` map does not expose package.json.
        run: echo "major=$(node -p "require('./node_modules/@changesets/cli/package.json').version.split('.')[0]")" >> "$GITHUB_OUTPUT"

      - name: Create Release Pull Request or Publish to npm
        if: steps.cli.outputs.major == '2'
        id: changesets
        uses: changesets/action@v1
        with:
          commit: 'chore: version packages'
          version: pnpm run version
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      # v2 pushes the version commit and tags through the GitHub API with
      # `github-token` (not the checkout's credentials, and not GITHUB_TOKEN from env),
      # so the app token goes here for the PR's checks to trigger. Published packages
      # are read from the CHANGESETS_OUTPUT file, which `pnpm run release` inherits.
      - name: Create Release Pull Request or Publish to npm
        if: steps.cli.outputs.major != '2'
        id: changesets-v3
        uses: changesets/action@v2
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          commit-message: 'chore: version packages'
          version-script: pnpm run version
          publish-script: pnpm run release
